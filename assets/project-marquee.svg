<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="t d">
<title id="t">Announcement Marquee</title>
<desc id="d">Dismissible, animated announcement bar for WordPress. Vanilla JS and CSS with no dependencies; remembers dismissal per session.</desc>
<style>@font-face{font-family:'BG Bold';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'BG Regular';src:url(data:font/woff;base64,) format('woff');}
.b{font-family:'BG Bold',system-ui,sans-serif}
.r{font-family:'BG Regular',system-ui,sans-serif}
.scroll{animation:scroll 3.2s linear infinite}
@keyframes scroll{to{transform:translateX(-40px)}}
@media (prefers-reduced-motion:reduce){.scroll{animation:none}}
</style>
<rect x=".5" y=".5" width="599" height="279" rx="17.5" fill="#0E1A2C" stroke="#22385A"/>
<g transform="translate(514 34)"><clipPath id="mq"><rect x="2" y="13" width="44" height="22" rx="11"/></clipPath><rect x="2" y="13" width="44" height="22" rx="11" fill="none" stroke="#8EA5C0" stroke-width="2.2"/><g clip-path="url(#mq)"><g class="scroll"><rect x="4" y="22.5" width="10" height="3" rx="1.5" fill="#5CC8FF"/><rect x="18" y="22.5" width="6" height="3" rx="1.5" fill="#8EA5C0"/><rect x="28" y="22.5" width="12" height="3" rx="1.5" fill="#8EA5C0"/><rect x="44" y="22.5" width="10" height="3" rx="1.5" fill="#5CC8FF"/><rect x="58" y="22.5" width="6" height="3" rx="1.5" fill="#8EA5C0"/><rect x="68" y="22.5" width="12" height="3" rx="1.5" fill="#8EA5C0"/></g></g></g>
<text class="b" x="37" y="74" font-size="30" fill="#EAF2FB" letter-spacing="-.3">Announcement Marquee</text>
<g class="r" font-size="21"><text x="38" y="132" fill="#8EA5C0">Dismissible, animated announcement bar for</text><text x="38" y="163" fill="#8EA5C0">WordPress. Vanilla JS and CSS with no</text><text x="38" y="194" fill="#8EA5C0">dependencies; remembers dismissal per session.</text></g>
<g class="r" font-size="19"><circle cx="45" cy="235.7" r="6.8" fill="#4F5D95"/><text x="60" y="242" fill="#EAF2FB">PHP</text><text x="119.7" y="242" fill="#8EA5C0">WordPress</text><text x="241.2" y="242" fill="#8EA5C0">JavaScript</text><text x="355.3" y="242" fill="#8EA5C0">CSS</text></g>
