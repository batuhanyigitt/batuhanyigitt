<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">3D T-Shirt &amp; Hoodie Configurator</title>
<desc id="d">Built with React Three Fiber. Shoppers place, rotate and scale artwork on 3D garments, export front and back images, and pick up saved designs later.</desc>
<style>@font-face{font-family:'BG Bold';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'BG Regular';src:url(data:font/woff;base64,) format('woff');}
.b{font-family:'BG Bold',system-ui,sans-serif}
.r{font-family:'BG Regular',system-ui,sans-serif}
.tee{animation:tee 12s ease-in-out infinite}
.ring{animation:ring 12s cubic-bezier(.6,0,.2,1) infinite}
.sway{transform-box:fill-box;transform-origin:center;animation:sway 6s ease-in-out infinite}
@keyframes tee{0%,16%{fill:#5CC8FF}20%,36%{fill:#EAF2FB}40%,56%{fill:#FFB547}60%,76%{fill:#FF6F91}80%,96%{fill:#6EE7B7}100%{fill:#5CC8FF}}
@keyframes ring{0%,16%{transform:translateX(0px)}20%,36%{transform:translateX(40px)}40%,56%{transform:translateX(80px)}60%,76%{transform:translateX(120px)}80%,96%{transform:translateX(160px)}100%{transform:translateX(0)}}
@keyframes sway{50%{transform:scaleX(.94)}}
@media (prefers-reduced-motion:reduce){.tee,.ring,.sway{animation:none}}
</style>
<defs>
  <clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#22385A" stroke-width="1"/>
  </pattern>
  <radialGradient id="spot" gradientUnits="userSpaceOnUse" cx="250.0" cy="170" r="260">
    <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gm"><rect width="500" height="400" fill="url(#spot)"/></mask>
  <radialGradient id="floor" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="400" fill="#0E1A2C"/>
  <rect width="500" height="400" fill="#13233A"/>
  <rect width="500" height="400" fill="url(#grid)" mask="url(#gm)"/>
  <ellipse cx="250.0" cy="300" rx="110" ry="11" fill="url(#floor)"/>
  <g transform="translate(130.0 34) scale(1.2)">
  <defs>
    <clipPath id="teeClip"><path d="M70 22C82 36 118 36 130 22L160 34L196 74L170 100L152 86L152 188Q100 194 48 188L48 86L30 100L4 74L40 34Z"/></clipPath>
    <linearGradient id="teeShade" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".38"/>
      <stop offset=".28" stop-color="#000" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".72" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </linearGradient>
  </defs>
  <g class="sway">
