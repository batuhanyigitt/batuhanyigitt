    <g clip-path="url(#teeClip)">
      <path d="M8.0 10Q0.6 100 8.0 196M26.4 10Q20.5 100 26.4 196M44.8 10Q40.4 100 44.8 196M63.2 10Q60.3 100 63.2 196M81.6 10Q80.1 100 81.6 196M100.0 10Q100.0 100 100.0 196M118.4 10Q119.9 100 118.4 196M136.8 10Q139.7 100 136.8 196M155.2 10Q159.6 100 155.2 196M173.6 10Q179.5 100 173.6 196M192.0 10Q199.4 100 192.0 196M0 18Q100 25 200 18M0 34Q100 41 200 34M0 50Q100 57 200 50M0 66Q100 73 200 66M0 82Q100 89 200 82M0 98Q100 105 200 98M0 114Q100 121 200 114M0 130Q100 137 200 130M0 146Q100 153 200 146M0 162Q100 169 200 162M0 178Q100 185 200 178M0 194Q100 201 200 194" fill="none" stroke="#0E1A2C" stroke-opacity=".2" stroke-width=".7"/>
      <rect x="0" y="0" width="200" height="200" fill="url(#teeShade)"/>
    </g>
    <path d="M70 22C82 36 118 36 130 22C120 46 80 46 70 22Z" fill="#0E1A2C" fill-opacity=".45"/>
    <path d="M40 34Q50 60 48 86M160 34Q150 60 152 86" fill="none" stroke="#0E1A2C" stroke-opacity=".3" stroke-width="1.2"/>
    <path d="M111.3 80.5L100.0 87.0L88.7 80.5L88.7 67.5L100.0 61.0L111.3 67.5ZM100 74L111.3 80.5M100 74L88.7 80.5M100 74L100.0 61.0" fill="none" stroke="#0E1A2C" stroke-opacity=".6" stroke-width="1.6" stroke-linejoin="round"/>
  </g></g>
  <circle cx="170.0" cy="350" r="12" fill="#5CC8FF"/><circle cx="210.0" cy="350" r="12" fill="#EAF2FB"/><circle cx="250.0" cy="350" r="12" fill="#FFB547"/><circle cx="290.0" cy="350" r="12" fill="#FF6F91"/><circle cx="330.0" cy="350" r="12" fill="#6EE7B7"/>
  <circle class="ring" cx="170.0" cy="350" r="17" fill="none" stroke="#EAF2FB" stroke-width="2"/>
  <line x1="500" y1="0" x2="500" y2="400" stroke="#22385A"/>
  <g class="b" font-size="44"><text x="562" y="112" fill="#EAF2FB" letter-spacing="-.6">3D T-Shirt &amp; Hoodie</text><text x="562" y="162" fill="#EAF2FB" letter-spacing="-.6">Configurator</text></g>
  <g class="r" font-size="23"><text x="564" y="228" fill="#8EA5C0">Built with React Three Fiber. Shoppers place, rotate</text><text x="564" y="262" fill="#8EA5C0">and scale artwork on 3D garments, export front and</text><text x="564" y="296" fill="#8EA5C0">back images, and pick up saved designs later.</text></g>
  <g class="r" font-size="19"><circle cx="571" cy="350.7" r="6.8" fill="#4E6A8C"/><text x="586" y="357" fill="#EAF2FB">Tuvval Creative</text><text x="744.8" y="357" fill="#8EA5C0">React Three Fiber</text><text x="924.5" y="357" fill="#8EA5C0">WooCommerce</text></g>
